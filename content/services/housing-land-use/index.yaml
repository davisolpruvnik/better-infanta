# Housing & Land Use Category Pages
# This file contains all the pages/services available under the Housing & Land Use category

pages:
  - name: "Zoning Certification for Business Permit"
    slug: "zoning-certification-business"
    description: "Evaluation of commercial locations to ensure alignment with the Comprehensive Land Use Plan (CLUP)."

  - name: "Zoning Certification for Construction and Land Activities"
    slug: "zoning-certification-land"
    description: "Zoning assessment prior to the construction of residential, commercial, or industrial structures."

  - name: "Issuance of Locational Clearance"
    slug: "locational-clearance"
    description: "Evaluation and clearance certifying that a proposed project conforms to the zoning and land use regulations of the municipality."

  - name: "Segregation of Land"
    slug: "land-segregation"
    description: "Processing files for subdividing, partitioning, or separating land ownership records under the Municipal Assessor."

  - name: "Issuance of Certificate of With/Without Landholdings"
    slug: "certificate-of-landholdings"
    description: "Assessor documentation certifying whether an individual has registered land assets under their name within the municipality."

  - name: "Issuance of Authenticated Copy of Tax Declaration"
    slug: "tax-declaration-copy"
    description: "Certified true copy of Real Property Tax Declarations for transfer of ownership, loans, or judicial purposes."

  - name: "Property Reclassification and Reassessment"
    slug: "property-reassessment-reclassification"
    description: "Updating assessor logs and tax assessments based on changes in actual property use (e.g., agricultural to commercial conversion)."